{{ define "main" }}

<div class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <ul>
    {{- range .Pages -}}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- with .Date -}}
      <span class="post-date">{{ .Format "Jan 02, 2006" }}</span>
      {{- end -}}
    </li>
    {{- end -}}
  </ul>
</div>

{{ end }}
