{{ define "main" }}

<div class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <span class="post-date">{{ .Date.Format "Jan 02, 2006" }}</span>
  {{ .Content }}
</div>

{{- with .Params.related_posts -}}
  {{- if ge (len .) 1 -}}
<div class="related">
  <h2>Related posts</h2>
  <ul class="related-posts">
    {{- range first 3 . -}}
    <li>
      <h3>
        <a href="{{ .Permalink }}">
          {{ .Title }}
          <small>{{ .Date.Format "Jan 02, 2006" }}</small>
        </a>
      </h3>
    </li>
    {{- end -}}
  </ul>
</div>
  {{- end -}}
{{- end -}}

{{ end }}
