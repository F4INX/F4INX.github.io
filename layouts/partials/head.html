<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta charset="utf-8">
  <!-- initial-scale and minimum-scale to 0.80 to fix sidebar display bug in mobile phone -->
  <meta name="viewport" content="width=device-width, initial-scale=0.80, minimum-scale=0.80">

  <title>
    {{- if eq .Title "Home" -}}
      {{ .Site.Title }} &middot; {{ .Site.Params.tagline -}}
    {{- else -}}
      {{ .Title }} &middot; {{ .Site.Title -}}
    {{- end -}}
  </title>

  <link rel="stylesheet" href="{{ "/style/css/f4inx.css" | relURL }}">

  {{ partial "mathjax.html" . }}
  
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.plot.ly/plotly-2.31.1.min.js"></script>
  <script src="{{ "/style/js/main.js" | relURL }}"></script>

  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ "/style/img/f4inx-black.svg" | relURL }}">
  <link rel="shortcut icon" href="{{ "/style/img/f4inx-black.svg" | relURL }}">

  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ "/atom.xml" | relURL }}">

  {{- /* SEO meta tags */ -}}
  <meta name="description" content="{{ .Site.Params.description }}">
  {{- if .IsPage -}}
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:type" content="article" />
  {{- end -}}
</head>
