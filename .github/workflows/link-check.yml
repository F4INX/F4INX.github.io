name: Link Check

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # 06:00 UTC every 6 days (keeps the GitHub Actions cache alive,
    # which expires after 7 days of no access)
    - cron: "0 6 */6 * *"
  workflow_dispatch:

jobs:
  linkchecker:
    name: Check links with LinkChecker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "https://f4inx.github.io/"

      - name: Restore pip cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.venv
          key: pip-cache-not-used
          restore-keys: |
            pip-venv

      - name: Install Python dependencies
        run: |
          if [ ! -d ~/.venv ]; then
            python3 -m venv ~/.venv
          fi
          ~/.venv/bin/pip install --upgrade pip
          ~/.venv/bin/pip install -r requirements.txt
          ~/.venv/bin/pip install -r requirements-pinned.txt

      - name: Save pip cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.venv
          key: pip-venv-${{ github.run_id }}

      - name: Restore link cache
        uses: actions/cache/restore@v6
        with:
          path: .linkchecker-cache.json
          # key is intentionally non-matching to force a cache miss; we only
          # want to restore via restore-keys prefix matching, so every run
          # saves a fresh entry (save won't overwrite an existing key).
          key: linkchecker-cache-not-used
          restore-keys: |
            linkchecker-cache

      - name: Run LinkChecker
        # The primp recheck is rate-limited to 2 req/s by default
        # (--recheck-rate in linkchecker.py) to avoid 403s from bot
        # protection.
        run: ~/.venv/bin/python3 linkchecker.py --ci

      - name: Save link cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .linkchecker-cache.json
          key: linkchecker-cache-${{ github.run_id }}

      - name: Upload link cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkchecker-cache
          path: .linkchecker-cache.json
          include-hidden-files: true
          retention-days: 7
