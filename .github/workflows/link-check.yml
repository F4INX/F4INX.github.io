name: Link Check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  linkchecker:
    name: Check links with LinkChecker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "https://f4inx.github.io/"

      - name: Install LinkChecker
        run: sudo apt-get update && sudo apt-get install -y linkchecker

      - name: Replace PLACEHOLDER with the CI workspace path
        run: sed "s|file:///PLACEHOLDER/|file://$GITHUB_WORKSPACE/public/|" .linkcheckerrc > .linkcheckerrc.ci

      - name: Run LinkChecker
        run: linkchecker --config .linkcheckerrc.ci --check-extern --no-warnings ./public/ 2>&1
