name: Link Check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lychee:
    name: Check links with lychee
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "https://f4inx.github.io/"

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --base-url: replaces deprecated --base (since lychee v0.21+)
          # .lycheeignore is picked up automatically, no need for --exclude-file
          args: --base-url https://f4inx.github.io/ --no-progress --verbose ./public/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
